<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Manufatura Eletrônica</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>⚙️ Manufatura Eletrônica News</h1>
        <p>Notícias agregadas do setor</p>
        <div id="filters">
            <button class="filter-btn active" data-category="all">Todas</button>
            <button class="filter-btn" data-category="Geral">Geral</button>
            <button class="filter-btn" data-category="Embarcados">Embarcados</button>
            <button class="filter-btn" data-category="Indústria">Indústria</button>
            <button class="filter-btn" data-category="Projetos">Projetos</button>
            <button class="filter-btn" data-category="Semicondutores">Semicondutores</button>
        </div>
    </header>

    <main id="news-container">
        <div class="loading">Carregando notícias...</div>
    </main>

    <footer>
        <p>Desenvolvido com RSS e JavaScript puro</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
